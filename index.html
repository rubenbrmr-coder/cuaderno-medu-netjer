<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Medu Netjer · Cuaderno de ejercicios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Gentium+Book+Plus:ital,wght@0,400;0,700;1,400&family=Noto+Sans+Egyptian+Hieroglyphs&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--pap:#f4ecdb;--pap2:#ebe0c8;--card:#fffaf0;--ink:#2b2418;--muted:#6f6350;--line:#dccfb2;--lapis:#1f3b6f;--lapis2:#2c5299;--gold:#b8862b;--gold2:#d9a944;--red:#a3402a;--green:#3d7a4a;--shadow:0 2px 10px rgba(60,40,10,.08)}
[data-theme=dark]{--pap:#16171c;--pap2:#1e2027;--card:#23262f;--ink:#ece4d2;--muted:#a59c8a;--line:#383c48;--lapis:#7fa3e6;--lapis2:#9db8ef;--gold:#d9a944;--gold2:#e8bf62;--red:#e07a5f;--green:#7cc08a;--shadow:0 2px 10px rgba(0,0,0,.3)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--pap);color:var(--ink);font-family:"Source Sans 3",system-ui,sans-serif;font-size:16px;line-height:1.5}
.tr{font-family:"Gentium Book Plus",serif;font-style:italic}
.hg{font-family:"Noto Sans Egyptian Hieroglyphs",serif;font-style:normal}
h1,h2,h3{font-family:"Cormorant Garamond",serif;color:var(--lapis);margin:.2em 0 .4em;line-height:1.15}
h1{font-size:2rem}h2{font-size:1.6rem}h3{font-size:1.3rem}
a{color:var(--lapis2)}
button{font:inherit;cursor:pointer}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
aside{background:var(--lapis);color:#f4ecdb;padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
[data-theme=dark] aside{background:#121a2e}
.brand{display:flex;gap:10px;align-items:center;margin-bottom:14px}
.brand .hg{font-size:2rem;color:var(--gold2)}
.brand b{font-family:"Cormorant Garamond",serif;font-size:1.3rem;line-height:1.05;display:block}
.brand small{opacity:.75;font-size:.8rem}
.nav a{display:flex;gap:10px;align-items:center;color:#f4ecdb;text-decoration:none;padding:9px 12px;border-radius:9px;font-weight:600}
.nav a:hover{background:rgba(255,255,255,.08)}
.nav a.on{background:var(--gold);color:#1a1408}
.nav .ic{width:22px;text-align:center}
aside .foot{margin-top:auto;font-size:.8rem;opacity:.8}
aside .foot button{background:transparent;border:1px solid rgba(255,255,255,.35);color:#f4ecdb;border-radius:8px;padding:5px 10px}
main{min-width:0;padding:26px clamp(14px,3vw,40px) 90px}
.wrap{max-width:980px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.btn{background:var(--lapis);color:#fff;border:0;border-radius:10px;padding:9px 16px;font-weight:600}
[data-theme=dark] .btn{color:#10131a}
.btn.ghost{background:transparent;color:var(--lapis);border:1px solid var(--line)}
.btn.gold{background:var(--gold);color:#1a1408}
.btn.green{background:var(--green);color:#fff}
.btn.red{background:var(--red);color:#fff}
.btn.sm{padding:5px 11px;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}.small{font-size:.88rem}
.hero{display:flex;gap:16px;align-items:center;margin-bottom:14px}
.hero .hg{font-size:2.8rem;color:var(--gold)}
.hero p{margin:0;color:var(--muted)}
.les{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer;text-decoration:none;color:var(--ink)}
.les:hover{border-color:var(--gold)}
.les .num{width:38px;height:38px;border-radius:50%;background:var(--pap2);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--lapis);flex:none}
.les.cur .num{background:var(--gold);color:#1a1408}
.les .ti{font-weight:600}
.bar{height:6px;background:var(--pap2);border-radius:4px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--green)}
.list{display:flex;flex-direction:column;gap:8px}
.sec{display:flex;flex-direction:column;gap:8px}
.sec .ic{font-size:1.6rem}
.tag{display:inline-block;font-size:.75rem;font-weight:700;border-radius:6px;padding:1px 7px;background:var(--pap2);color:var(--muted);border:1px solid var(--line)}
.tag.ok{background:var(--green);color:#fff;border-color:var(--green)}
.tag.gold{background:var(--gold2);color:#1a1408;border-color:var(--gold2)}
/* quiz */
.quiz{max-width:760px;margin:0 auto}
.qtop{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.qtop .bar{flex:1;height:8px}
.qbox{text-align:center;padding:24px 20px}
.qprompt{font-size:1.1rem;color:var(--muted);margin-bottom:10px}
.qbig{font-size:clamp(2rem,7vw,3.2rem);line-height:1.25;margin:6px 0 10px;word-break:break-all}
.qtr{font-size:1.5rem;color:var(--lapis);font-weight:700;margin:4px 0}
.qes{font-size:1.25rem;font-weight:600;margin:6px 0}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{text-align:left;padding:13px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-size:1.05rem}
.opt:hover:not([disabled]){border-color:var(--lapis)}
.opt .hg{font-size:1.7rem}
.opt.right{border-color:var(--green);background:rgba(61,122,74,.13)}
.opt.wrong{border-color:var(--red);background:rgba(163,64,42,.1)}
.inp{width:100%;padding:12px 14px;font-size:1.2rem;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-family:"Gentium Book Plus",serif}
.inp:focus{outline:none;border-color:var(--gold)}
textarea.inp{font-family:"Source Sans 3",sans-serif;font-size:1.05rem;min-height:84px;resize:vertical}
.kb{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin:10px 0}
.kb button{min-width:36px;padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--pap2);color:var(--red);font-family:"Gentium Book Plus",serif;font-style:italic;font-size:1.1rem}
.fb{margin-top:16px;padding:14px 16px;border-radius:12px;text-align:left}
.fb.ok{background:rgba(61,122,74,.13);border:1px solid var(--green)}
.fb.ko{background:rgba(163,64,42,.1);border:1px solid var(--red)}
.fb b.t{display:block;margin-bottom:4px}
.gl{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.gl span{background:var(--pap2);border:1px solid var(--line);border-radius:8px;padding:2px 8px;font-size:.9rem}
.gl span i{font-family:"Gentium Book Plus",serif;color:var(--lapis)}
.ord{min-height:54px;border:2px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;margin:10px 0;justify-content:center}
.chip{border:1px solid var(--line);background:var(--card);color:var(--lapis);border-radius:10px;padding:6px 12px;font-family:"Gentium Book Plus",serif;font-style:italic;font-size:1.15rem}
.chip.used{opacity:.25}
.sumbig{font-size:3rem;font-family:"Cormorant Garamond",serif;color:var(--lapis);font-weight:700}
/* textos */
.tline{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.tline .hg{font-size:clamp(1.7rem,5vw,2.4rem);line-height:1.3;word-break:break-all}
.tline .tr{font-size:1.2rem;color:var(--lapis);margin:4px 0}
.tline .es{font-weight:600}
.tline .note{font-size:.9rem;color:var(--muted);margin-top:6px;border-left:3px solid var(--gold);padding-left:10px}
.tline.done{border-color:var(--green)}
.hide{display:none}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--pap);padding:8px 16px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.on{opacity:.95}
table.st{border-collapse:collapse;width:100%;font-size:.95rem}
table.st td,table.st th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
table.st th{color:var(--muted);font-weight:600}
select.inp{font-family:inherit;font-size:1rem;padding:8px}
.bottom{display:none}
.mtop{display:none;justify-content:space-between;align-items:center;margin-bottom:10px}
.mtop b{font-family:"Cormorant Garamond",serif;font-size:1.3rem;color:var(--lapis)}
@media (max-width:820px){
 .app{grid-template-columns:minmax(0,1fr)}
 aside{display:none}
 main{padding:14px 12px 92px}
 .bottom{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--lapis);z-index:40;justify-content:space-around;padding:6px 2px calc(6px + env(safe-area-inset-bottom))}
 [data-theme=dark] .bottom{background:#121a2e}
 .bottom a{color:#f4ecdb;text-decoration:none;display:flex;flex-direction:column;align-items:center;font-size:.7rem;padding:4px 6px;border-radius:8px;flex:1}
 .bottom a .ic{font-size:1.2rem}
 .bottom a.on{background:var(--gold);color:#1a1408}
 .mtop{display:flex}
 h1{font-size:1.6rem}
 .hero .hg{font-size:2.2rem}
 .qbox{padding:18px 12px}
}
</style>
</head>

los textos rituales; el ḥrj-tp era también experto en magia.","h":"𓄡𓂋𓇋𓇋𓎛𓃀𓏏𓁷𓂋𓏭𓁶𓏤"}],"id":"t0"},{"req":5,"title":"Una familia en su estela","src":"Estelas familiares de Abido (Reino Medio), fórmulas típicas","intro":"En las estelas de Abido el propietario aparece rodeado de su familia; cada figura lleva una breve leyenda con su relación de parentesco.","lines":[{"l":"ḥmt.f mrt.f nbt pr","a":"su esposa, su amada, la señora de la casa","g":["ḥmt.f=su esposa","mrt.f=su amada","nbt pr=señora de la casa"],"n":"nbt pr es el título habitual de la mujer casada.","h":"𓈞𓏏𓁐𓆑𓌸𓂋𓄈𓏏𓄹𓆑𓎟𓏏𓉐𓏤"},{"l":"sꜣ.f mrjj.f","a":"su hijo, su amado","g":["sꜣ.f=su hijo","mrjj.f=su amado"],"n":"mrjj es un participio pasivo (lección 23), aquí usado como epíteto fijo.","h":"𓅭𓏤𓀀𓆑𓌸𓂋𓇋𓇋𓆑"},{"l":"sꜣt.f mrt.f","a":"su hija, su amada","g":["sꜣt.f=su hija","mrt.f=su amada"],"n":"Femenino: sꜣt, mrt.","h":"𓅭𓏏𓁐𓆑𓌸𓂋𓄈𓏏𓄹𓆑"},{"l":"jt.f sš","a":"su padre, el escriba","g":["jt.f=su padre","sš=escriba"],"n":"Aposición: «su padre, (que era) escriba».","h":"𓇋𓏏𓆑𓀀𓆑𓏞𓀀"},{"l":"mwt.f nbt pr","a":"su madre, la señora de la casa","g":["mwt.f=su madre","nbt pr=señora de la casa"],"n":"","h":"𓅐𓏏𓁐𓆑𓎟𓏏𓉐𓏤"},{"l":"sn.f n mwt.f","a":"su hermano de madre","g":["sn.f=su hermano","n=de","mwt.f=su madre"],"n":"Precisaba el parentesco: «hermano por parte de su madre».","h":"𓌢𓈖𓀀𓆑𓈖𓅐𓏏𓁐𓆑"}],"id":"t1"},{"req":6,"title":"Epítetos de los dioses","src":"Fórmulas de ofrendas y textos religiosos del Reino Medio","intro":"Los dioses se nombran casi siempre con epítetos fijos que indican su función o su lugar de culto. Son adjetivos, genitivos y nisbes.","lines":[{"l":"nṯr ꜥꜣ nb pt","a":"el gran dios, señor del cielo","g":["nṯr=dios","ꜥꜣ=grande","nb=señor","pt=cielo"],"n":"Epíteto habitual de Ra y de Osiris.","h":"𓊹𓀭𓉻𓂝𓄿𓎟𓊪𓏏𓇯"},{"l":"jnpw tpj ḏw.f","a":"Anubis, el que está sobre su montaña","g":["jnpw=Anubis","tpj=que está sobre (nisbe)","ḏw.f=su montaña"],"n":"Anubis vigila la necrópolis desde la montaña del desierto.","h":"𓇋𓈖𓊪𓅱𓃢𓁶𓊪𓏭𓈋𓏤𓆑"},{"l":"jmj wt nb tꜣ ḏsr","a":"el que está en el lugar de embalsamamiento, señor de la tierra sagrada","g":["jmj=que está en (nisbe)","wt=lugar de embalsamamiento","nb=señor","tꜣ ḏsr=tierra sagrada (necrópolis)"],"n":"Otros dos epítetos de Anubis.","h":"𓐝𓇋𓅱𓏏𓎟𓇾𓏤𓂦𓂋𓈓"},{"l":"ptḥ rsj jnb.f","a":"Ptah, el que está al sur de su muro","g":["ptḥ=Ptah","rsj=al sur","jnb.f=su muro"],"n":"Ptah de Menfis («Muro Blanco»).","h":"𓊪𓏏𓎛𓀭𓇔𓏭𓈅𓇋𓆛𓈖𓃀𓊅𓆑"},{"l":"nb ꜥnḫ-tꜣwj","a":"señor de Anj-tawy","g":["nb=señor","ꜥnḫ-tꜣwj=«Vida de las Dos Tierras» (barrio de Menfis)"],"n":"","h":"𓎟𓋹𓇿𓇿𓆰"},{"l":"nṯrw nbw jmjw ꜣbḏw","a":"todos los dioses que están en Abido","g":["nṯrw=dioses","nbw=todos","jmjw=que están en","ꜣbḏw=Abido"],"n":"Nisbe plural concordando con nṯrw.","h":"𓊹𓀭𓅱𓏥𓎟𓅱𓏥𓐝𓇋𓅱𓏥𓍋𓃀𓂧𓈋𓊖𓀀𓁐"}],"id":"t2"},{"req":7,"title":"El rey según la Enseñanza lealista","src":"Enseñanza lealista (Reino Medio)","intro":"Un padre aconseja a sus hijos venerar al rey. Lo describe con una serie de oraciones nominales con pw que lo identifican con dioses.","lines":[{"l":"kꜣ pw nswt","a":"el rey es un ka (una fuerza vital)","g":["kꜣ=ka","pw=es","nswt=rey"],"n":"Oración nominal A pw B: «el rey es un ka».","h":"𓂓𓏤𓊪𓅱𓇓𓏏𓈖"},{"l":"ḥw pw rꜣ.f","a":"su boca es Hu (la palabra creadora)","g":["ḥw=Hu, palabra con autoridad","pw=es","rꜣ.f=su boca"],"n":"rꜣ «boca» se escribe r en muchas ediciones.","h":"𓎛𓅱𓅆𓊪𓅱𓂋𓏤𓆑"},{"l":"sjꜣ pw ḥꜣtj.f","a":"su corazón es Sia (la percepción)","g":["sjꜣ=Sia, percepción","pw=es","ḥꜣtj.f=su corazón"],"n":"Hu y Sia eran fuerzas personificadas del dios creador.","h":"𓋷𓄿𓊪𓅱𓄂𓏏𓏭𓄣𓆑"},{"l":"ẖnmw pw n ḥꜥw nb","a":"él es el Jnum de todo cuerpo","g":["ẖnmw=Jnum (dios alfarero)","pw=es","n=de","ḥꜥw=cuerpo","nb=todo"],"n":"Jnum moldeaba a los seres humanos en su torno: el rey «da forma» a su pueblo.","h":"𓎸𓅱𓊪𓅱𓈖𓎛𓂝𓅱𓊛𓏥𓎟"}],"id":"t3"},{"req":8,"title":"Una fórmula de ofrendas a Anubis","src":"Estelas funerarias del Reino Medio (fórmula canónica)","intro":"La segunda gran versión de la fórmula de ofrendas se dirige a Anubis en vez de a Osi   <div class="card sec"><h3 style="margin:0">Pendientes hoy</h3><div class="sumbig">${due.length}</div><button class="btn gold" id="r1">${due.length?'Repasar':'Ronda mixta'}</button></div>
  <div class="card sec"><h3 style="margin:0">Puntos débiles</h3><div class="sumbig">${weak.length}</div><p class="small muted" style="margin:0">Elementos que has fallado más veces de las que has acertado.</p><button class="btn" id="r2" ${weak.length?'':'disabled'}>Practicar puntos débiles</button></div>
  <div class="card sec"><h3 style="margin:0">Mezcla general</h3><p class="small muted" style="margin:0">Preguntas de todos los temas hasta el ${ST.cur}.</p><button class="btn ghost" id="r3">Empezar (20)</button></div>
 </div>
 <p class="small muted" style="margin-top:14px">${all.length} elementos en seguimiento (vocabulario, signos y frases).</p>`;
 $('#r1').onclick=startReview;
 $('#r2').onclick=()=>startSession({title:'Puntos débiles',list:shuffle(weak).slice(0,20).map(qForItem).filter(Boolean),back:'repaso'});
 $('#r3').onclick=()=>startSession({title:'Mezcla general',gen:()=>genOne(rnd(ST.cur)+1,'mix'),max:20,back:'repaso'});
}
function vFrases(n){
 const fr=FR.filter(f=>f.n===n);
 $('#view').innerHTML=`<a class="btn ghost sm" href="#tema-${n}">← Tema ${n}</a><h1 style="margin-top:10px">Frases del tema ${n}</h1>
 <p class="muted small">Toca una frase para ver la traducción y el análisis.</p>
 <div class="list">${fr.map((f,i)=>`<div class="tline" data-i="${i}"><div class="hg">${esc(f.h)}</div><div class="tr">${esc(f.l)}</div><div class="hide det"><div class="es">«${esc(f.a)}»</div><div class="small"><span class="tag">${esc(f.f)}</span></div>${glossHTML(f)}</div></div>`).join('')}</div>`;
 document.querySelectorAll('.tline').forEach(e=>e.onclick=()=>e.querySelector('.det').classList.toggle('hide'));
}
function vTextos(){
 const groups={};D.T.forEach(t=>{(groups[t.req]=groups[t.req]||[]).push(t)});
 $('#view').innerHTML=`<div class="hero"><span class="hg">𓌃</span><div><h1>Textos reales</h1><p>Fragmentos de inscripciones y obras del egipcio medio, ordenados por la gramática que necesitas. Puedes abrir cualquiera; los que superan tu tema actual están marcados.</p></div></div>
 ${Object.keys(groups).sort((a,b)=>a-b).map(r=>`<h3>Desde el tema ${r} · ${esc(D.L[r-1].title)}</h3><div class="list" style="margin-bottom:12px">${groups[r].map(t=>`<a class="les" href="#texto-${t.id}"><span class="num" style="${+r>ST.cur?'opacity:.5':''}">${ST.tdone[t.id]?'✓':r}</span><div style="flex:1;min-width:0"><div class="ti">${esc(t.title)}</div><div class="small muted">${esc(t.src)} · ${t.lines.length} líneas${+r>ST.cur?' · <span class="tag">aún no estudiado</span>':''}</div></div></a>`).join('')}</div>`).join('')}
 <p class="small muted">Las transliteraciones, traducciones y notas son propias. Los fragmentos se han simplificado o normalizado en algunos puntos para ajustarlos a la ortografía del curso; las fuentes indican el texto original. Cuando una línea es una frase modelo y no una cita literal, la nota lo indica.</p>`;
}
function vTexto(id){
 const t=D.T.find(x=>x.id===id);if(!t)return route('textos');
 const st=ST.tl[id]||(ST.tl[id]={});
 const showAll=!!SHOWALL[id];
 $('#view').innerHTML=`<a class="btn ghost sm" href="#textos">← Textos</a>
 <h1 style="margin-top:10px">${esc(t.title)}</h1>
 <p class="small muted" style="margin:0">${esc(t.src)} · necesita el tema ${t.req}</p>
 <div class="card" style="margin:12px 0"><p style="margin:0">${esc(t.intro)}</p></div>
 <div class="row" style="margin-bottom:12px"><button class="btn ghost sm" id="all">${showAll?'Modo estudio (ocultar soluciones)':'Mostrar todo (lectura corrida)'}</button><span class="small muted">${Object.values(st).filter(x=>x===1).length}/${t.lines.length} líneas entendidas</span></div>
 <div id="lines">${t.lines.map((l,i)=>`<div class="tline ${st[i]===1?'done':''}" data-i="${i}">
   <div class="small muted">Línea ${i+1}</div>
   <div class="hg">${esc(l.h)}</div>
   <div class="tr ${showAll?'':'hide'} r1">${esc(l.l)}</div>
   ${showAll?'':`<div class="row r0" style="margin:6px 0"><button class="btn ghost sm s1">Ver transliteración</button></div><textarea class="inp tt" placeholder="Tu traducción (opcional)" style="min-height:52px;margin:6px 0"></textarea><button class="btn sm s2">Ver traducción y análisis</button>`}
   <div class="${showAll?'':'hide'} r2"><div class="es">«${esc(l.a)}»</div>${glossHTML(l)}${l.n?`<div class="note">${esc(l.n)}</div>`:''}
   ${showAll?'':`<div class="row" style="margin-top:8px"><button class="btn green sm k1">✓ La entendí</button><button class="btn ghost sm k0">Repasar</button></div>`}</div>
 </div>`).join('')}</div>
 <div class="row" style="justify-content:center;margin-top:10px"><button class="btn gold" id="done">${ST.tdone[id]?'✓ Texto leído':'Marcar texto como leído'}</button></div>`;
 $('#all').onclick=()=>{SHOWALL[id]=!showAll;vTexto(id)};
 document.querySelectorAll('.tline').forEach(e=>{
  const i=+e.dataset.i;
  const q=c=>e.querySelector(c);
  if(q('.s1'))q('.s1').onclick=()=>{q('.r1').classList.remove('hide');q('.r0').classList.add('hide')};
  if(q('.s2'))q('.s2').onclick=()=>{q('.r1').classList.remove('hide');const r0=q('.r0');if(r0)r0.classList.add('hide');q('.r2').classList.remove('hide');q('.s2').classList.add('hide');
   const v=q('.tt').value.trim();if(v){const w=normEs(t.lines[i].a).split(' ').filter(x=>x.length>3);const hit=w.filter(x=>normEs(v).includes(' '+x.slice(0,5))).length;if(w.length)toast(`Coincidencias con la traducción: ${hit}/${w.length} palabras clave`)}};
  if(q('.k1'))q('.k1').onclick=()=>{st[i]=1;e.classList.add('done');rec({n:t.req},true);save();toast('¡Bien!')};
  if(q('.k0'))q('.k0').onclick=()=>{st[i]=0;e.classList.remove('done');rec({n:t.req},false);save()};
 });
 $('#done').onclick=()=>{ST.tdone[id]=!ST.tdone[id];save();vTexto(id)};
}
const SHOWALL={};
function vProgreso(){
 const tot=Object.values(ST.st).reduce((a,b)=>a+b[1],0),ok=Object.values(ST.st).reduce((a,b)=>a+b[0],0);
 const days=Object.keys(ST.days).sort().slice(-14);
 $('#view').innerHTML=`<div class="hero"><span class="hg">𓋹</span><div><h1>Progreso</h1><p>${tot} respuestas · ${tot?Math.round(ok/tot*100):0} % de aciertos · racha de ${streak()} días · ${Object.values(ST.tdone).filter(Boolean).length} textos leídos</p></div></div>
 <div class="card"><table class="st"><tr><th>Tema</th><th>Respuestas</th><th>Aciertos</th><th>Dominio</th><th>Examen</th></tr>
 ${D.L.map(l=>{const s=lesStats(l.n);return `<tr><td><a href="#tema-${l.n}">${l.n}. ${esc(l.title)}</a></td><td>${s[1]}</td><td>${s[1]?Math.round(s[0]/s[1]*100)+' %':'—'}</td><td><div class="bar" style="width:80px"><i style="width:${lesPct(l.n)}%"></i></div></td><td>${ST.exams[l.n]!=null?ST.exams[l.n]+' %':'—'}</td></tr>`}).join('')}</table></div>
 ${days.length?`<h3 style="margin-top:18px">Actividad reciente</h3><div class="row" style="align-items:flex-end;gap:4px;height:90px">${days.map(d=>{const v=ST.days[d];const mx=Math.max(...days.map(x=>ST.days[x]));return `<div title="${String(d).slice(6)}/${String(d).slice(4,6)}: ${v}" style="width:22px;background:var(--gold);border-radius:4px 4px 0 0;height:${Math.max(4,v/mx*80)}px"></div>`}).join('')}</div>`:''}
 <h3 style="margin-top:22px">Ajustes</h3>
 <div class="card sec">
  <label class="row"><input type="checkbox" id="mdc" ${ST.mdc?'checked':''}> Aceptar transliteración en teclado MdC (A=ꜣ a=ꜥ H=ḥ x=ḫ X=ẖ S=š T=ṯ D=ḏ i=j)</label>
  <div class="row"><button class="btn ghost sm" id="bk">Copia de seguridad</button><button class="btn ghost sm" id="rs">Restaurar copia</button><button class="btn red sm" id="reset">Borrar todo el progreso</button></div>
  <div id="bkbox"></div>
  <p class="small muted" style="margin:0">${DOC?'Tu progreso se guarda en tu cuenta y en este navegador.':'Tu progreso se guarda en este dispositivo.'}</p>
 </div>`;
 $('#mdc').onchange=e=>{ST.mdc=e.target.checked;save()};
 $('#bk').onclick=()=>{const t=JSON.stringify({app:'cuaderno-medu-netjer',v:1,st:ST});$('#bkbox').innerHTML=`<textarea class="inp" readonly>${esc(t)}</textarea>`;try{navigator.clipboard.writeText(t).then(()=>toast('Copiada al portapapeles'),()=>{})}catch(e){}};
 $('#rs').onclick=()=>{$('#bkbox').innerHTML=`<textarea class="inp" id="rst" placeholder="Pega aquí la copia"></textarea><button class="btn sm" id="rok">Restaurar</button>`;$('#rok').onclick=()=>{try{const d=JSON.parse($('#rst').value);if(!d.st)throw 0;ST=Object.assign(ST,d.st);save();toast('Restaurado');vProgreso()}catch(e){toast('Copia no válida')}}};
 let armed=false;$('#reset').onclick=e=>{if(!armed){armed=true;e.target.textContent='Pulsa otra vez para confirmar';return}const keep={theme:ST.theme,mdc:ST.mdc};ST={cur:1,mdc:keep.mdc,theme:keep.theme,srs:{},st:{},days:{},exams:{},tl:{},tdone:{},seenIntro:true};save();toast('Progreso borrado');vProgreso()};
}
/* ================= router ================= */
function route(force){
 if(typeof force==='string'&&location.hash!=='#'+force){location.hash=force;return}
 const h=(location.hash||'#inicio').slice(1);
 let act=h.startsWith('tema')||h.startsWith('frases')?'temas':h.startsWith('texto')?'textos':h;
 if(h==='sesion')act='';
 $('#nav').innerHTML=navHTML(act);$('#bnav').innerHTML=navHTML(act);
 $('#curLbl').textContent='Tema actual: '+ST.cur;
 let m;
 if(h==='sesion'){if(SES){renderQ(!SES.q);return}location.hash='inicio';return}
 if((m=h.match(/^tema-(\d+)$/)))vTema(+m[1]);
 else if((m=h.match(/^frases-(\d+)$/)))vFrases(+m[1]);
 else if((m=h.match(/^texto-(t\d+)$/)))vTexto(m[1]);
 else ({inicio:vInicio,temas:vTemas,repaso:vRepaso,textos:vTextos,progreso:vProgreso}[h]||vInicio)();
 window.scrollTo(0,0);
}
window.addEventListener('hashchange',()=>route());
document.addEventListener('keydown',e=>{if(location.hash!=='#sesion'||!SES||!SES.q)return;if(SES.q.kind==='mc'&&!SES.answered&&/^[1-4]$/.test(e.key))answerMC(+e.key-1);else if(SES.answered&&e.key==='Enter'&&document.activeElement.tagName!=='TEXTAREA'&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='BUTTON'){e.preventDefault();nextStep()}});
$('#themeBtn').onclick=toggleTheme;$('#themeBtn2').onclick=toggleTheme;
applyTheme();route();initDB();
</script>
</body>
</html>
